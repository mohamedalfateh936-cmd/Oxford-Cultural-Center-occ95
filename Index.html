<script>
(function(){
'use strict';

/* ============ Storage ============ */
var store = {
  get:function(k,d){ try{ var v=localStorage.getItem('occ_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem('occ_'+k, JSON.stringify(v)); }catch(e){} }
};

var idb = {
  db:null,
  open:function(){
    var self=this;
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open('occ_files',2);
        r.onupgradeneeded=function(e){
          var db=e.target.result;
          if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'});
        };
        r.onsuccess=function(e){ self.db=e.target.result; res(self.db); };
        r.onerror=function(e){ rej(e); };
      }catch(err){ rej(err); }
    });
  },
  put:function(o){ var self=this; return new Promise(function(res,rej){ var run=function(){ try{ var t=self.db.transaction('files','readwrite'); t.objectStore('files').put(o); t.oncomplete=function(){res();}; t.onerror=function(e){rej(e);}; }catch(e){rej(e);} }; if(!self.db) self.open().then(run,rej); else run(); }); },
  get:function(id){ var self=this; return new Promise(function(res,rej){ var run=function(){ try{ var t=self.db.transaction('files','readonly'); var r=t.objectStore('files').get(id); r.onsuccess=function(){res(r.result);}; r.onerror=function(e){rej(e);}; }catch(e){rej(e);} }; if(!self.db) self.open().then(run,rej); else run(); }); },
  del:function(id){ var self=this; return new Promise(function(res,rej){ var run=function(){ try{ var t=self.db.transaction('files','readwrite'); t.objectStore('files').delete(id); t.oncomplete=function(){res();}; t.onerror=function(e){rej(e);}; }catch(e){rej(e);} }; if(!self.db) self.open().then(run,rej); else run(); }); }
};

/* ============ Catalog ============ */
var CATEGORIES = [

    {id:'ja_kid', name:'ياباني - أطفال'},{id:'ja_adult', name:'ياباني - كبار'}
  ]},

    {id:'pharm_d', name:'دبلوم الصيدلة الوظيفية'}
  ]},
  { id:'cs', name:'علوم الحاسوب', icon:'💻', courses:[

    {id:'cs_c', name:'كورس علوم الحاسوب'},

    {id:'workshops', name:'دورات تدريبية وورش'},{id:'teacher_tr', name:'تأهيل وتدريب المعلمين'}
  ]}
];
var ALL_COURSES = [];
CATEGORIES.forEach(function(c){ c.courses.forEach(function(co){ ALL_COURSES.push({id:co.id,name:co.name,catId:c.id,catName:c.name,icon:c.icon}); }); });
function courseById(id){ for(var i=0;i<ALL_COURSES.length;i++){ if(ALL_COURSES[i].id===id) return ALL_COURSES[i]; } return {name:'—',icon:'📘',catName:'—',catId:''}; }

var SUPER_ADMIN_USERNAME = 'Mohamedalfateh56';
var SUPER_ADMIN_NAME = 'محمد الفاتح حمد محمد';
var SUPER_ADMIN_DEFAULT_PASS = 'Admin@2026';
var SUPER_ADMIN_CODE = 'SUPER-OCC-95-MASTER';

function $(s){ return document.querySelector(s); }
function $$(s){ return document.querySelectorAll(s); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ return (Number(n)||0).toLocaleString('en-US')+' ج.م'; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowStr(){ return new Date().toLocaleString('ar-EG'); }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function genCode(prefix){ var r1=Math.random().toString(36).slice(2,6).toUpperCase(); var r2=Math.random().toString(36).slice(2,6).toUpperCase(); return prefix+'-'+r1+'-'+r2; }
function startOfWeek(d){ var x=new Date(d); var day=x.getDay(); var diff=(day+1)%7; x.setDate(x.getDate()-diff); x.setHours(0,0,0,0); return x; }
function startOfMonth(d){ var x=new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; }

function toast(msg,type){
  type = type||'ok';
  var t = document.createElement('div');
  t.className = 'alert '+type;
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;min-width:240px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.15)';
  document.body.appendChild(t);
  setTimeout(function(){ t.style.transition='.3s'; t.style.opacity='0'; setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },300); }, 2200);
}

var state = { screen:'home', page:null, role:null, user:null, staffMode:false, staffParentMode:false, viewingStudentId:null, viewingParentId:null };

var Data = {
  admins:function(){return store.get('admins',[]);}, setAdmins:function(v){store.set('admins',v);},
  staff:function(){return store.get('staff',[]);}, setStaff:function(v){store.set('staff',v);},
  students:function(){return store.get('students',[]);}, setStudents:function(v){store.set('students',v);},
  parents:function(){return store.get('parents',[]);}, setParents:function(v){store.set('parents',v);},
  txs:function(){return store.get('txs',[]);}, setTxs:function(v){store.set('txs',v);},

};

function isSuperAdmin(u){ return u && (u.isSuperAdmin === true || u.username === SUPER_ADMIN_USERNAME); }

function seedSuperAdmin(){
  var admins = Data.admins();
  var found = false;
  for(var i=0;i<admins.length;i++){ if(admins[i].username === SUPER_ADMIN_USERNAME){ found = true; admins[i].isSuperAdmin = true; break; } }
  if(!found){
    admins.unshift({
      id:'super_'+uid(), name:SUPER_ADMIN_NAME, phone:'', username:SUPER_ADMIN_USERNAME,
      password:SUPER_ADMIN_DEFAULT_PASS, code:SUPER_ADMIN_CODE,
      role:'superadmin', isSuperAdmin:true, createdAt:nowStr()
    });
    Data.setAdmins(admins);
  }
}

function attachPasswordToggles(root){
  root = root || document;
  var eyes = root.querySelectorAll('[data-pwtoggle]');
  for(var i=0;i<eyes.length;i++){
    (function(btn){
      btn.onclick = function(e){
        e.preventDefault();
        var targetId = btn.getAttribute('data-pwtoggle');
        var input = document.getElementById(targetId);
        if(!input) return;
        if(input.type === 'password'){ input.type='text'; btn.textContent='🙈'; }
        else { input.type='password'; btn.textContent='👁️'; }
      };
    })(eyes[i]);
  }
}

function tryAutofill(role, userFieldId, passFieldId){
  var last = Data.lastLogin();
  var saved = last && last[role];
  var uf = document.getElementById(userFieldId);
  var pf = document.getElementById(passFieldId);
  if(!uf || !pf || !saved) return false;
  var bar = document.getElementById('autofill-bar-'+role);
  if(bar){
    bar.style.display = 'flex';
    bar.innerHTML = '<div class="info">👋 مرحباً '+esc(saved.name||saved.username)+' — هل تريد تسجيل الدخول؟</div>' +
      '<button class="btn small success" id="autofill-do-'+role+'">✅ ملء تلقائي</button>' +
      '<button class="btn small ghost" id="autofill-clear-'+role+'">❌ مسح</button>';
    var doBtn = document.getElementById('autofill-do-'+role);
    var clrBtn = document.getElementById('autofill-clear-'+role);
    if(doBtn) doBtn.onclick = function(){ uf.value=saved.username||''; pf.value=saved.password||''; uf.focus(); };
    if(clrBtn) clrBtn.onclick = function(){ bar.style.display='none'; var l=Data.lastLogin(); delete l[role]; Data.setLastLogin(l); };
  }
  return true;
}
function saveLastLogin(role, user){
  var last = Data.lastLogin();
  last[role] = { username:user.username, password:user.password, name:user.name };
  Data.setLastLogin(last);
}

function go(screen,opts){
  opts = opts||{};
  state.screen = screen;
  if(opts.page!==undefined) state.page = opts.page;
  if(opts.role!==undefined) state.role = opts.role;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  var app = $('#app');
  if(!app) return;
  var html = '';
  try {
    if(state.screen==='home')         html = viewHome();
    else if(state.screen==='auth')    html = viewAuth();
    else if(state.screen==='admin')   html = viewAdminShell();
    else if(state.screen==='student') html = viewStudentShell();
    else if(state.screen==='parent')  html = viewParentShell();
    else                              html = viewHome();
    app.innerHTML = html;
  } catch(e){
    app.innerHTML = '<div class="err-box">خطأ:\n'+(e.message||e)+'\n\n'+(e.stack||'')+'</div>';
    return;
  }
  bindCommon();
  try {
    if(state.screen==='admin')   bindAdmin();
    if(state.screen==='student') bindStudent();
    if(state.screen==='parent')  bindParent();
    if(state.screen==='auth')    bindAuth();
  } catch(e){
    app.innerHTML += '<div class="err-box">خطأ في الأحداث:\n'+(e.message||e)+'</div>';
  }
  attachPasswordToggles(app);
}

function topBar(title,showBack,showClose){
  if(showClose===undefined) showClose = true;
  return '<div class="topbar">'+
    '<div class="logo"><span>🎓</span><span>مركز أوكسفورد الثقافي</span><span class="badge">OCC 95</span></div>'+
    '<div style="display:flex;gap:8px;align-items:center">'+
      (title?'<span class="pill">'+esc(title)+'</span>':'')+
      (showBack?'<button class="icon-btn" id="btn-back" title="رجوع">↩</button>':'')+
      (showClose?'<button class="icon-btn danger" id="btn-close" title="إغلاق">✕</button>':'')+
    '</div>'+
  '</div>';
}

function bindCommon(){
  var back = $('#btn-back');
  if(back) back.onclick = function(){
    if(state.screen==='admin'||state.screen==='student'||state.screen==='parent'){ state.page='home'; render(); }
    else if(state.screen==='auth'){ state.role=null; state.user=null; go('home'); }
    else { go('home'); }
  };
  var cl = $('#btn-close');
  if(cl) cl.onclick = function(){ if(confirm('هل تريد إغلاق التطبيق؟')){ window.close(); setTimeout(function(){ alert('أغلق التبويب يدوياً.'); },100); } };
}

function bindAuth(){
  var role = state.role;
  attachPasswordToggles();
  tryAutofill(role, 'li-user', 'li-pass');

  $$('.nav-tab[data-atab]').forEach(function(t){
    t.onclick = function(){
      $$('.nav-tab[data-atab]').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      var k = t.getAttribute('data-atab');
      $('#pane-login').style.display = k==='login'?'block':'none';
      $('#pane-invite').style.display = k==='invite'?'block':'none';
      var fg = $('#pane-forgot'); if(fg) fg.style.display = 'none';
    };
  });

  $$('.nav-tab[data-ptab]').forEach(function(t){
    t.onclick = function(){
      $$('.nav-tab[data-ptab]').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      var k = t.getAttribute('data-ptab');
      $('#pane-login').style.display = k==='login'?'block':'none';
      $('#pane-register').style.display = k==='register'?'block':'none';
    };
  });

  var liBtn = $('#li-btn');
  if(liBtn) liBtn.onclick = function(){
    var u = $('#li-user').value.trim();
    var p = $('#li-pass').value;
    var user = null;

    if(role === 'admin'){
      var list = Data.admins();
      for(var i=0;i<list.length;i++){ if(list[i].username===u && list[i].password===p){ user=list[i]; break; } }
    } else if(role === 'student'){
      state.staffMode = false;
      state.viewingStudentId = null;
      var sl = Data.students();
      for(var i=0;i<sl.length;i++){ if(sl[i].username===u && sl[i].password===p){ user=sl[i]; break; } }
      if(!user){
        var al = Data.admins();
        for(var j=0;j<al.length;j++){
          if(al[j].username===u && al[j].password===p){ user=al[j]; state.staffMode=true; break; }
        }
      }
    } else if(role === 'parent'){
      state.staffParentMode = false;
      state.viewingParentId = null;
      var pl = Data.parents();
      for(var k=0;k<pl.length;k++){ if(pl[k].username===u && pl[k].password===p){ user=pl[k]; break; } }
      if(!user){
        var al2 = Data.admins();
        for(var m=0;m<al2.length;m++){
          if(al2[m].username===u && al2[m].password===p){ user=al2[m]; state.staffParentMode=true; break; }
        }
      }
    }

    if(!user){ $('#li-msg').innerHTML = '<div class="alert err">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>'; return; }
    state.user = user;
    saveLastLogin(role, user);

    if(role === 'admin') go('admin',{page:'home'});
    else if(role === 'student') go('student',{page:'home'});
    else go('parent',{page:'home'});
    toast('مرحباً '+user.name);
  };

  var liForgot = $('#li-forgot');
  if(liForgot) liForgot.onclick = function(){
    var fg = $('#pane-forgot');
    if(fg) fg.style.display = fg.style.display==='none'?'block':'none';
  };
  var fgBack = $('#fg-back');
  if(fgBack) fgBack.onclick = function(){ var fg = $('#pane-forgot'); if(fg) fg.style.display = 'none'; };

  var fgSave = $('#fg-save');
  if(fgSave) fgSave.onclick = function(){
    var code = $('#fg-code').value.trim().toUpperCase();
    var user = $('#fg-user').value.trim();
    var p1 = $('#fg-pass').value, p2 = $('#fg-pass2').value;
    var err = function(m){ $('#fg-msg').innerHTML = '<div class="alert err">'+m+'</div>'; };
    if(!code) return err('أدخل الرمز');
    if(!user) return err('أدخل اسم المستخدم');
    if(!p1 || p1.length<4) return err('كلمة المرور قصيرة');
    if(p1 !== p2) return err('كلمتا المرور غير متطابقتين');

    var done = false;
    var sl = Data.students();
    for(var i=0;i<sl.length;i++){
      if(sl[i].username===user && String(sl[i].code||'').toUpperCase()===code){ sl[i].password=p1; Data.setStudents(sl); done=true; break; }
    }
    if(!done){
      var al = Data.admins();
      for(var j=0;j<al.length;j++){
        if(al[j].username===user && String(al[j].code||'').toUpperCase()===code){ al[j].password=p1; Data.setAdmins(al); done=true; break; }
      }
    }
    if(!done){
      var pl = Data.parents();
      for(var k=0;k<pl.length;k++){
        if(pl[k].username===user && String(pl[k].code||'').toUpperCase()===code){ pl[k].password=p1; Data.setParents(pl); done=true; break; }
      }
    }
    if(!done) return err('❌ الرمز أو اسم المستخدم غير صحيح');

    $('#fg-msg').innerHTML = '<div class="alert ok">✅ تم تغيير كلمة المرور</div>';
    setTimeout(function(){
      $('#fg-code').value='';$('#fg-user').value='';$('#fg-pass').value='';$('#fg-pass2').value='';
      var fg = $('#pane-forgot'); if(fg) fg.style.display='none';
      $('#li-user').value = user;
      $('#li-pass').value = '';
      $('#li-msg').innerHTML = '<div class="alert ok">✅ سجّل الدخول بكلمة المرور الجديدة</div>';
    }, 900);
  };

  var prSave = $('#pr-save');
  if(prSave) prSave.onclick = function(){
    var name=$('#pr-name').value.trim(), phone=$('#pr-phone').value.trim(), child=$('#pr-child').value.trim();
    var u=$('#pr-user').value.trim(), p=$('#pr-pass').value, p2=$('#pr-pass2').value;
    var err = function(m){ $('#pr-msg').innerHTML = '<div class="alert err">'+m+'</div>'; };
    if(!name) return err('أدخل اسمك');
    if(!phone) return err('أدخل رقم هاتفك');
    if(!child) return err('أدخل اسم ابنك');
    if(u.length<4) return err('اسم المستخدم قصير');
    if(p.length<4) return err('كلمة المرور قصيرة');
    if(p !== p2) return err('كلمتا المرور غير متطابقتين');

    var students = Data.students();
    var matched = null;
    for(var i=0;i<students.length;i++){ if(students[i].name===child || students[i].name.indexOf(child)!==-1){ matched=students[i]; break; } }

    var parents = Data.parents();
    for(var j=0;j<parents.length;j++){ if(parents[j].username===u) return err('اسم المستخدم مستخدم'); }

    var parent = { id:uid(), name:name, phone:phone, childName:child, childId:matched?matched.id:null,

    parents.push(parent);

    if(!code){ $('#inv-msg1').innerHTML = '<div class="alert err">أدخل الرمز</div>'; return; }
    var invs = Data.invitations();

    for(var i=0;i<invs.length;i++){ if(invs[i].code===code){ inv=invs[i]; break; } }
    if(!inv){ $('#inv-msg1').innerHTML = '<div class="alert err">❌ الرمز غير موجود</div>'; return; }
    if(inv.used){ $('#inv-msg1').innerHTML = '<div class="alert err">❌ مستخدم</div>'; return; }

    $('#inv-name').value=inv.name; $('#inv-phone').value=inv.phone||''; $('#inv-role').value=inv.role||'';
    $('#inv-step1').style.display='none'; $('#inv-step2').style.display='block';

  var invSave = $('#inv-save');

    if(p.length<4) return err('كلمة مرور قصيرة');
    if(p !== p2) return err('غير متطابقتين');
    var admins = Data.admins();
    for(var i=0;i<admins.length;i++){ if(admins[i].username===u) return err('مستخدم'); }
    var newCode = genCode('ADM');
    admins.push({ id:uid(), name:inv.name, phone:inv.phone||'', username:u, password:p, code:newCode,
      role:'admin', isSuperAdmin:false, jobTitle:inv.role||'', createdAt:nowStr() });
    Data.setAdmins(admins);
    var invs = Data.invitations();
    for(var j=0;j<invs.length;j++){ if(invs[j].id===inv.id){ invs[j].used=true; invs[j].usedAt=nowStr(); break; } }

    toast('تم الإنشاء');
    setTimeout(function(){ $$('.nav-tab[data-atab]')[0].click(); $('#li-user').value=u; $('#li-pass').value=''; }, 2500);
  };

          (!inv.used?'<button class="btn small danger btn-del-inv" data-id="'+inv.id+'">حذف</button>':'')+
        '</div></div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.copy-btn').forEach(function(b){ b.onclick = function(){ copyText(b.getAttribute('data-code')); }; });
    box.querySelectorAll('.btn-del-inv').forEach(function(b){
      b.onclick = function(){
        if(!confirm('حذف الدعوة؟')) return;
        Data.setInvitations(Data.invitations().filter(function(x){ return x.id!==b.getAttribute('data-id'); }));
        toast('تم'); drawList();
      };
    });
  };
  drawList();
  $('#iv-gen').onclick = function(){
    var name=$('#iv-name').value.trim(), phone=$('#iv-phone').value.trim(), role=$('#iv-role').value.trim();
    var msg = $('#iv-msg');
    if(!name){ msg.innerHTML = '<div class="alert err">اكتب الاسم</div>'; return; }
    if(!phone){ msg.innerHTML = '<div class="alert err">اكتب الهاتف</div>'; return; }
    var code = genCode('STF');

    list.push({id:uid(), code:code, name:name, phone:phone, role:role, used:false, createdBy:state.user.name, createdAt:nowStr()});
    Data.setInvitations(list);
    msg.innerHTML = '<div class="alert ok">✅ تم توليد الرمز</div><div class="code-box">'+code+'</div><button class="btn small ghost" id="iv-copy2">📋 نسخ</button>';
    var cb = $('#iv-copy2'); if(cb) cb.onclick = function(){ copyText(code); };
    $('#iv-name').value='';$('#iv-phone').value='';$('#iv-role').value='';
    drawList();
  };
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('تم النسخ'); }, function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea'); ta.value=txt;
  ta.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('تم النسخ'); }catch(e){}
  document.body.removeChild(ta);
}

function addPayment(id){
  var students = Data.students();
  var s = null;
  for(var i=0;i<students.length;i++){ if(students[i].id===id){ s=students[i]; break; } }
  if(!s) return;
  var st = studentStatus(s);
  openModal(

    '<label>نوع الدفعة</label><select id="p-kind"><option>رسوم التسجيل</option><option>رسوم الدراسة</option><option>القسط الأول</option><option>القسط الثاني</option><option>دفعة أخرى</option></select>'+
    '<label>المبلغ</label><input id="p-amount" type="number" value="0">'+
    '<label>طريقة الاستلام</label><select id="p-method"><option value="cash">كاش</option><option value="bank">بنك</option></select>'+
    '<div id="p-txn-wrap" style="display:none"><label>رقم العملية</label><input id="p-txn"></div>'+
    '<label>التاريخ</label><input id="p-date" type="date" value="'+todayStr()+'">'+
    '<label>ملاحظات</label><input id="p-note"><div id="p-msg"></div><hr>'+
    '<div class="row"><button class="btn success" id="p-save">💾 حفظ</button><button class="btn ghost" id="p-cancel">إلغاء</button></div>'
  );
  $('#p-cancel').onclick = closeModal;
  $('#p-method').onchange = function(e){ $('#p-txn-wrap').style.display = e.target.value==='bank'?'block':'none'; };
  $('#p-save').onclick = function(){
    var kind=$('#p-kind').value, amount=Number($('#p-amount').value);
    var method=$('#p-method').value, txn=$('#p-txn').value.trim();
    var date=$('#p-date').value||todayStr(), note=$('#p-note').value.trim();
    if(!amount || amount<=0){ $('#p-msg').innerHTML = '<div class="alert err">أدخل مبلغاً</div>'; return; }
    if(method==='bank' && !txn){ $('#p-msg').innerHTML = '<div class="alert err">أدخل رقم العملية</div>'; return; }
    var all = Data.students();
    var stu = null;
    for(var i=0;i<all.length;i++){ if(all[i].id===id){ stu=all[i]; break; } }
    if(!stu) return;
    stu.payments = stu.payments||[];
    stu.payments.push({ id:uid(), kind:kind, amount:amount, method:method, txn:txn, date:date, note:note });
    var txs = Data.txs();
    txs.push({ id:uid(), type:'income', category:'رسوم طالب', subKind:kind, amount:amount,
      method:method, txn:txn, date:date, studentId:stu.id, studentName:stu.name, note:note||kind });
    Data.setTxs(txs); Data.setStudents(all);
    if(state.user && state.user.id===id) state.user = stu;
    closeModal(); toast('تم'); render();
  };
}

/* ============ Finance ============ */
function adminFinance(){
  return '<div class="card"><h2>💰 الحسابات المالية</h2>'+
    '<div class="nav-tabs" style="margin-top:8px">'+
      '<div class="nav-tab active" data-fin="daily">اليومية</div>'+
      '<div class="nav-tab" data-fin="weekly">الأسبوعية</div>'+
      '<div class="nav-tab" data-fin="monthly">الشهرية</div>'+
      '<div class="nav-tab" data-fin="add">➕ إضافة حركة</div>'+
    '</div><div id="fin-content"></div></div>';
}
function bindAdminFinance(){
  var content = $('#fin-content');
  var renderDaily = function(){
    var txs = Data.txs().filter(function(t){ return t.date===todayStr(); });
    content.innerHTML = txsView(txs, 'حركات اليوم ('+todayStr()+')');
    bindTxActions(content);
  };
  var renderWeekly = function(){
    var start = startOfWeek(new Date());
    var days = [];
    for(var i=0;i<7;i++){ var d = new Date(start); d.setDate(start.getDate()+i); days.push(fmtDate(d)); }
    var txs = Data.txs().filter(function(t){ return days.indexOf(t.date)!==-1; });
    var totalIn=0, totalEx=0, rows = '';
    days.forEach(function(d){
      var inc=0, exp=0;
      txs.forEach(function(t){ if(t.date===d){ if(t.type==='income') inc+=t.amount; else exp+=t.amount; } });
      totalIn+=inc; totalEx+=exp;
      rows += '<tr><td>'+d+'</td><td>'+money(inc)+'</td><td>'+money(exp)+'</td><td>'+money(inc-exp)+'</td></tr>';
    });
    content.innerHTML = '<div class="grid grid-3" style="margin-bottom:12px">'+
      '<div class="stat green"><div class="lbl">إيرادات الأسبوع</div><div class="val">'+money(totalIn)+'</div></div>'+
      '<div class="stat red"><div class="lbl">مصروفات الأسبوع</div><div class="val">'+money(totalEx)+'</div></div>'+
      '<div class="stat"><div class="lbl">صافي الأسبوع</div><div class="val">'+money(totalIn-totalEx)+'</div></div></div>'+
      '<div class="table-wrap"><table><thead><tr><th>اليوم</th><th>الإيرادات</th><th>المصروفات</th><th>الصافي</th></tr></thead><tbody>'+rows+'</tbody></table></div><hr>'+
      txsView(txs,'تفاصيل الحركات',true);
    bindTxActions(content);
  };
  var renderMonthly = function(){
    var start = startOfMonth(new Date());
    var cur = new Date(startOfWeek(start));
    var weeks = [];
    for(var i=0;i<6;i++){
      var ws = new Date(cur), we = new Date(cur); we.setDate(cur.getDate()+6);
      if(ws.getMonth()===start.getMonth() || we.getMonth()===start.getMonth()) weeks.push({s:fmtDate(ws),e:fmtDate(we)});
      cur.setDate(cur.getDate()+7);
    }
    var txs = Data.txs();
    var totalIn=0, totalEx=0, rows = '';
    weeks.forEach(function(w, i){
      var inc=0, exp=0;
      txs.forEach(function(t){ if(t.date>=w.s && t.date<=w.e){ if(t.type==='income') inc+=t.amount; else exp+=t.amount; } });
      totalIn+=inc; totalEx+=exp;
      rows += '<tr><td>الأسبوع '+(i+1)+'</td><td>'+w.s+'</td><td>'+w.e+'</td><td>'+money(inc)+'</td><td>'+money(exp)+'</td><td>'+money(inc-exp)+'</td></tr>';
    });
    var mname = new Date().toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
    content.innerHTML = '<h3>الشهر: '+mname+'</h3>'+
      '<div class="grid grid-3" style="margin:12px 0">'+
        '<div class="stat green"><div class="lbl">الإيراد الشهري</div><div class="val">'+money(totalIn)+'</div></div>'+
        '<div class="stat red"><div class="lbl">المصروفات</div><div class="val">'+money(totalEx)+'</div></div>'+
        '<div class="stat"><div class="lbl">الصافي</div><div class="val">'+money(totalIn-totalEx)+'</div></div></div>'+
      '<div class="table-wrap"><table><thead><tr><th>الأسبوع</th><th>من</th><th>إلى</th><th>الإيرادات</th><th>المصروفات</th><th>الصافي</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  };
  var renderAdd = function(){
    content.innerHTML = '<div class="grid grid-2">'+
      '<div><label>نوع الحركة</label><select id="f-type"><option value="income">إيراد</option><option value="expense">مصروف</option></select></div>'+
      '<div><label>الفئة</label><input id="f-cat"></div>'+
      '<div><label>المبلغ</label><input id="f-amount" type="number" value="0"></div>'+
      '<div><label>التاريخ</label><input id="f-date" type="date" value="'+todayStr()+'"></div>'+
      '<div><label>طريقة الدفع</label><select id="f-method"><option value="cash">كاش</option><option value="bank">بنك</option></select></div>'+
      '<div id="f-txn-wrap" style="display:none"><label>رقم العملية</label><input id="f-txn"></div>'+
    '</div><label>ملاحظات</label><textarea id="f-note" rows="2"></textarea>'+
    '<div id="f-msg"></div><hr><button class="btn success" id="f-save">💾 حفظ</button>';
    $('#f-method').onchange = function(e){ $('#f-txn-wrap').style.display = e.target.value==='bank'?'block':'none'; };
    $('#f-save').onclick = function(){
      var type=$('#f-type').value, cat=$('#f-cat').value.trim();
      var amount=Number($('#f-amount').value), date=$('#f-date').value||todayStr();
      var method=$('#f-method').value, txn=$('#f-txn').value.trim(), note=$('#f-note').value.trim();
      if(!cat){ $('#f-msg').innerHTML = '<div class="alert err">أدخل الفئة</div>'; return; }
      if(!amount||amount<=0){ $('#f-msg').innerHTML = '<div class="alert err">أدخل مبلغاً</div>'; return; }
      if(method==='bank'&&!txn){ $('#f-msg').innerHTML = '<div class="alert err">أدخل رقم العملية</div>'; return; }
      var txs = Data.txs();
      txs.push({ id:uid(), type:type, category:cat, subKind:cat, amount:amount, method:method, txn:txn, date:date, note:note });
      Data.setTxs(txs); toast('تم'); render();
    };
  };
  $$('.nav-tab[data-fin]').forEach(function(t){
    t.onclick = function(){
      $$('.nav-tab[data-fin]').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      var k = t.getAttribute('data-fin');
      if(k==='daily') renderDaily();
      else if(k==='weekly') renderWeekly();
      else if(k==='monthly') renderMonthly();
      else if(k==='add') renderAdd();
    };
  });
  renderDaily();
}
function txsView(txs,title,hideHead){
  var inc=0, exp=0;
  txs.forEach(function(t){ if(t.type==='income') inc+=t.amount; else exp+=t.amount; });
  var head = '';
  if(!hideHead) head = '<div class="grid grid-3" style="margin-bottom:12px">'+
    '<div class="stat green"><div class="lbl">إيرادات</div><div class="val">'+money(inc)+'</div></div>'+
    '<div class="stat red"><div class="lbl">مصروفات</div><div class="val">'+money(exp)+'</div></div>'+
    '<div class="stat"><div class="lbl">الصافي</div><div class="val">'+money(inc-exp)+'</div></div></div>';
  var body = '';
  if(txs.length){
    var rows = '';
    txs.forEach(function(t){
      rows += '<tr><td>'+esc(t.date)+'</td>'+
        '<td>'+(t.type==='income'?'<span class="tag green">إيراد</span>':'<span class="tag red">مصروف</span>')+'</td>'+
        '<td>'+esc(t.category)+(t.studentName?' – '+esc(t.studentName):'')+'</td>'+
        '<td>'+money(t.amount)+'</td><td>'+(t.method==='cash'?'كاش':'بنك')+'</td>'+
        '<td>'+esc(t.txn||'—')+'</td>'+
        '<td><button class="btn small danger btn-del-tx" data-id="'+t.id+'">حذف</button></td></tr>';
    });
    body = '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الفئة</th><th>المبلغ</th><th>الطريقة</th><th>رقم العملية</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  } else body = '<p class="hint">لا توجد حركات.</p>';
  return head+'<h3>'+esc(title)+'</h3>'+body;
}
function bindTxActions(root){
  if(!root) return;
  root.querySelectorAll('.btn-del-tx').forEach(function(b){ b.onclick = function(){ deleteTx(b.getAttribute('data-id')); }; });
}
function deleteTx(id){
  if(!confirm('حذف الحركة؟')) return;
  Data.setTxs(Data.txs().filter(function(t){ return t.id!==id; }));
  toast('تم'); render();
}

/* ============ FILE HELPERS ============ */
function getBlobFromRecord(f){
  if(!f) return null;
  if(f.blob instanceof Blob) return f.blob;
  if(f.data){
    try {
      var parts = f.data.split(','); var mime = parts[0].match(/:(.*?);/)[1];
      var bstr = atob(parts[1]); var n = bstr.length; var u8 = new Uint8Array(n);
      while(n--){ u8[n] = bstr.charCodeAt(n); }
      return new Blob([u8], {type:mime});
    } catch(e){ return null; }
  }
  return null;
}

/* ============ DOWNLOAD via data URL (FIXED) ============ */
function downloadFromDataUrl(dataUrl, name){
  try {
    var a = document.createElement('a');
    a.href = dataUrl;
    a.download = name || 'file';
    a.rel = 'noopener';
    a.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{ if(a.parentNode) document.body.removeChild(a); }catch(e){}
    }, 1500);
    toast('⬇️ جاري التنزيل: ' + name);
  } catch(e){
    toast('فشل التنزيل: ' + e.message, 'err');
  }
}

function downloadFile(id){
  idb.get(id).then(function(f){
    var blob = getBlobFromRecord(f);
    if(!blob){ toast('غير موجود','err'); return; }
    var reader = new FileReader();
    reader.onload = function(){ downloadFromDataUrl(reader.result, (f && f.name) || 'file'); };
    reader.onerror = function(){ toast('فشل قراءة الملف','err'); };
    reader.readAsDataURL(blob);
  });
}

function downloadBlob(blob, name){
  var reader = new FileReader();
  reader.onload = function(){ downloadFromDataUrl(reader.result, name); };
  reader.onerror = function(){ toast('فشل قراءة الملف','err'); };
  reader.readAsDataURL(blob);
}

/* ============ FILE VIEWER (FIXED - no blob URLs) ============ */
function viewFile(id){
  idb.get(id).then(function(f){
    if(!f){ toast('الملف غير موجود','err'); return; }
    var blob = getBlobFromRecord(f);
    if(!blob || blob.size === 0){ toast('الملف فارغ','err'); return; }

    var mime = (f.type || '').toLowerCase();
    var name = f.name || 'ملف';

    // Convert to data URL (safe on all browsers/mobile)
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      var body = '';

      if(mime.indexOf('image') === 0 || /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i.test(name)){
        body = '<img src="' + dataUrl + '" alt="">';
      } else if(mime.indexOf('video') === 0 || /\.(mp4|webm|mov|avi|mkv)$/i.test(name)){
        body = '<video src="' + dataUrl + '" controls playsinline preload="metadata" style="background:#000"></video>';
      } else if(mime.indexOf('audio') === 0 || /\.(mp3|wav|ogg|m4a|aac)$/i.test(name)){
        body = '<div class="viewer-info"><div class="big-icon">🎵</div><audio src="' + dataUrl + '" controls preload="metadata"></audio></div>';
      } else if(mime.indexOf('pdf') !== -1 || /\.pdf$/i.test(name)){
        body = '<iframe src="' + dataUrl + '" title="PDF" style="width:100%;height:82vh;border:none;background:#fff"></iframe>' +
          '<p style="color:#94a3b8;font-size:12px;margin-top:8px;text-align:center">إذا لم يظهر، اضغط زر التحميل في الأعلى</p>';
      } else if(mime.indexOf('presentation') !== -1 || mime.indexOf('powerpoint') !== -1 || /\.(ppt|pptx)$/i.test(name)){
        body = '<div class="viewer-info"><div class="big-icon">📊</div><p style="margin-bottom:20px">PowerPoint — حمّل الملف لفتحه:</p><button class="btn" id="viewer-big-dl">⬇️ تحميل</button></div>';
      } else if(mime.indexOf('word') !== -1 || /\.(doc|docx)$/i.test(name)){
        body = '<div class="viewer-info"><div class="big-icon">📝</div><p style="margin-bottom:20px">Word — حمّل الملف لفتحه:</p><button class="btn" id="viewer-big-dl">⬇️ تحميل</button></div>';
      } else if(mime.indexOf('text') === 0 || /\.(txt|csv|json)$/i.test(name)){
        body = '<iframe src="' + dataUrl + '" style="background:#fff;width:100%;height:82vh;border:none"></iframe>';
      } else {
        body = '<div class="viewer-info"><div class="big-icon">📄</div><p style="margin-bottom:20px">لا يمكن معاينته — حمّل الملف:</p><button class="btn" id="viewer-big-dl">⬇️ تحميل</button></div>';
      }

      var infoExtra = ' • ' + (blob.size/1024/1024).toFixed(2) + ' MB';
      var root = $('#modal-root');
      root.innerHTML = '<div class="viewer-bg">'+
        '<div class="viewer-bar">'+
          '<div class="viewer-title">📎 ' + esc(name) + '<span style="font-size:11px;opacity:.7">'+infoExtra+'</span></div>'+
          '<div style="display:flex;gap:8px">'+
            '<button class="icon-btn" id="viewer-dl" title="تحميل">⬇️</button>'+
            '<button class="icon-btn danger" id="viewer-close" title="إغلاق">✕</button>'+
          '</div>'+
        '</div>'+
        '<div class="viewer-content">' + body + '</div>'+
      '</div>';

      function cleanup(){ root.innerHTML = ''; }
      $('#viewer-close').onclick = cleanup;
      $('#viewer-dl').onclick = function(){ downloadFromDataUrl(dataUrl, name); };
      var bigDl = $('#viewer-big-dl');
      if(bigDl) bigDl.onclick = function(){ downloadFromDataUrl(dataUrl, name); };
      var escH = function(e){ if(e.key==='Escape'){ cleanup(); document.removeEventListener('keydown', escH); } };
      document.addEventListener('keydown', escH);
    };
    reader.onerror = function(){ toast('فشل قراءة الملف','err'); };
    reader.readAsDataURL(blob);
  }, function(err){ toast('فشل الوصول للملف','err'); });
}

/* ============ SAVE AS IMAGE (FIXED - data URL) ============ */
function saveAsImage(innerHtml, title){
  var W = 800;
  var temp = document.createElement('div');
  temp.innerHTML = innerHtml;
  var invoice = temp.querySelector('.invoice') || temp;
  var rows = invoice.querySelectorAll('.inv-row');
  var topPadding = 40;
  var estimatedH = topPadding * 3 + rows.length * 32 + 200;

  var scale = 2;
  var canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = estimatedH * scale;
  var ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, estimatedH);

  var y = topPadding;
  ctx.fillStyle = '#1e293b';
  ctx.font = 'bold 20px Tahoma, Arial';
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  ctx.fillText('مركز أوكسفورد الثقافي - فرع 95 OCC', W/2, y);
  y += 30;

  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(W-30, y); ctx.stroke();
  y += 25;

  var dateP = invoice.querySelector('p');
  if(dateP){
    ctx.fillStyle = '#475569';
    ctx.font = '14px Tahoma, Arial';
    ctx.textAlign = 'center';
    ctx.fillText(dateP.textContent.trim(), W/2, y);
    y += 25;
  }

  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var spans = r.querySelectorAll('span');
    if(spans.length >= 2){
      var isTotal = r.className.indexOf('total') !== -1;
      var label = spans[0].textContent.trim();
      var val = spans[1].textContent.trim();
      ctx.font = (isTotal ? 'bold 15px' : '14px') + ' Tahoma, Arial';
      ctx.fillStyle = isTotal ? '#1e293b' : '#475569';
      ctx.textAlign = 'right';
      ctx.fillText(label, W - 40, y);
      ctx.fillStyle = '#1e293b';
      ctx.textAlign = 'left';
      ctx.fillText(val, 40, y);
      if(isTotal){
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(30, y - 18); ctx.lineTo(W-30, y - 18); ctx.stroke();
      } else {
        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
        ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.moveTo(30, y + 8); ctx.lineTo(W-30, y + 8); ctx.stroke();
        ctx.setLineDash([]);
      }
      y += 32;
    }
  }

  y += 20;
  ctx.fillStyle = '#64748b';
  ctx.font = '12px Tahoma, Arial';
  ctx.textAlign = 'center';
  ctx.fillText('جميع البيانات محفوظة لدى مركز أوكسفورد الثقافي فرع 95 OCC', W/2, y);
  y += 18;
  ctx.fillText('© 2026 - 2027', W/2, y);

  var finalH = y + 30;
  var finalCanvas = document.createElement('canvas');
  finalCanvas.width = W * scale;
  finalCanvas.height = finalH * scale;
  var fctx = finalCanvas.getContext('2d');
  fctx.fillStyle = '#ffffff';
  fctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
  fctx.drawImage(canvas, 0, 0);

  var dataUrl;
  try {
    dataUrl = finalCanvas.toDataURL('image/png', 0.95);
  } catch(e){
    toast('فشل توليد الصورة: ' + e.message, 'err');
    return;
  }

  var suggestedName = 'invoice_' + Date.now() + '.png';

  // Try File System Access API (desktop Chrome/Edge only)
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if(window.showSaveFilePicker && !isMobile){
    try {
      fetch(dataUrl).then(function(r){ return r.blob(); }).then(function(blob){
        window.showSaveFilePicker({
          suggestedName: suggestedName,
          types: [{ description: 'صورة PNG', accept: {'image/png': ['.png']} }]
        }).then(function(handle){ return handle.createWritable(); })
          .then(function(writable){
            return blob.arrayBuffer().then(function(buf){
              return writable.write(buf).then(function(){ return writable.close(); });
            });
          })
          .then(function(){ toast('✅ تم الحفظ في: ' + suggestedName); })
          .catch(function(err){
            if(err && err.name === 'AbortError'){ toast('أُلغي الحفظ','warn'); }
            else downloadFromDataUrl(dataUrl, suggestedName);
          });
      }).catch(function(){ downloadFromDataUrl(dataUrl, suggestedName); });
      return;
    } catch(e){ /* fall through */ }
  }

  // Mobile + fallback: use data URL download
  downloadFromDataUrl(dataUrl, suggestedName);
}

function bindAdminBackup(){
  $('#bk-export-file').onclick = function(){
    try {
      var data = exportAllData();
      var json = JSON.stringify(data);
      var blob = new Blob([json], {type:'application/json'});
      var reader = new FileReader();
      reader.onload = function(){ downloadFromDataUrl(reader.result, 'occ95_backup_' + todayStr() + '.json'); };
      reader.readAsDataURL(blob);
      $('#bk-export-msg').innerHTML = '<div class="alert ok">✅ تم التصدير</div>';
    } catch(e){ $('#bk-export-msg').innerHTML = '<div class="alert err">خطأ: '+e.message+'</div>'; }
  };
  $('#bk-export-code').onclick = function(){
    try {
      var data = exportAllData();
      var json = JSON.stringify(data);
      var b64 = btoa(unescape(encodeURIComponent(json)));
      $('#bk-export-msg').innerHTML =
        '<div class="alert ok">✅ تم توليد الرمز</div>'+
        '<textarea readonly rows="5" style="font-family:monospace;font-size:11px">'+esc(b64)+'</textarea>'+
        '<button class="btn small ghost" id="bk-copy-code" style="margin-top:8px">📋 نسخ</button>';
      $('#bk-copy-code').onclick = function(){ copyText(b64); };
    } catch(e){ $('#bk-export-msg').innerHTML = '<div class="alert err">خطأ: '+e.message+'</div>'; }
  };
  $('#bk-import-file').onclick = function(){
    var input = $('#bk-file');
    if(!input.files[0]){ $('#bk-import-msg').innerHTML = '<div class="alert err">اختر ملفاً</div>'; return; }
    var reader = new FileReader();
    reader.onload = function(){
      try { var data = JSON.parse(reader.result); applyImport(data); }
      catch(e){ $('#bk-import-msg').innerHTML = '<div class="alert err">ملف غير صالح</div>'; }
    };
    reader.readAsText(input.files[0]);
  };
  $('#bk-import-code').onclick = function(){
    var code = $('#bk-code').value.trim();
    if(!code){ $('#bk-import-msg').innerHTML = '<div class="alert err">الصق الرمز</div>'; return; }
    try {
      var json = decodeURIComponent(escape(atob(code)));
      var data = JSON.parse(json);
      applyImport(data);
    } catch(e){ $('#bk-import-msg').innerHTML = '<div class="alert err">رمز غير صالح</div>'; }
  };
}
function exportAllData(){
  return { version:2, exportedAt:nowStr(), exportedBy: state.user ? state.user.name : 'unknown',
    admins:Data.admins(), staff:Data.staff(), students:Data.students(), parents:Data.parents(),
    txs:Data.txs(), hr:Data.hr(), content:Data.content(), invitations:Data.invitations() };
}
function applyImport(data){
  if(!data || typeof data !== 'object'){ $('#bk-import-msg').innerHTML = '<div class="alert err">بيانات غير صالحة</div>'; return; }
  if(!confirm('سيتم استبدال جميع البيانات. متأكد؟')) return;
  try {
    if(data.admins) Data.setAdmins(data.admins);
    if(data.staff) Data.setStaff(data.staff);
    if(data.students) Data.setStudents(data.students);
    if(data.parents) Data.setParents(data.parents);
    if(data.txs) Data.setTxs(data.txs);
    if(data.hr) Data.setHr(data.hr);
    if(data.content) Data.setContent(data.content);
    if(data.invitations) Data.setInvitations(data.invitations);
    $('#bk-import-msg').innerHTML = '<div class="alert ok">✅ تم الاستيراد</div>';
    setTimeout(function(){ state.screen='home'; state.user=null; state.role=null; render(); }, 1200);
  } catch(e){ $('#bk-import-msg').innerHTML = '<div class="alert err">خطأ: '+e.message+'</div>'; }
}

    while(el && el !== document.body){
      if(el.classList && el.classList.contains('role-card')){
        var role = el.getAttribute('data-role');
        if(role){ pickRole(role); return; }
      }
      el = el.parentNode;
    }
  });
  try {
    render();
    var b = $('#boot-screen');
    if(b && b.parentNode) b.parentNode.removeChild(b);
  } catch(e){
    var app = $('#app');
    if(app) app.innerHTML = '<div class="err-box">فشل التشغيل:\n'+(e.message||e)+'\n\n'+(e.stack||'')+'</div>';
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
